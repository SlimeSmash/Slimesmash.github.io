title: SlimeSmash
description: SlimeSmash 2.0 is live! Defend your base in 360° Defense Mode, equip pets, play in 5 languages and climb global leaderboards. Free retro arcade wave-survival game on Google Play.
url: https://slimesmash.github.io

# Jekyll skips dot-folders by default; Android App Links need this one published.
include:
  - .well-known

# Help center / wiki: every file in _help/ becomes a page at /help/<path>/
collections:
  help:
    output: true
    permalink: /help/:path/
    
plugins:
  - jekyll-sitemap
defaults:
  - scope: { path: "", type: "help" }
    values:
      layout: article
      styles: [help]
      scripts: [help]
      order: 50

exclude:
  - README.md
  - migrate.sh
  - Gemfile
  - Gemfile.lock
  - vendor
