- q: Is SlimeSmash free?
  a: Yes. It is free to download on [Google Play](https://play.google.com/store/apps/details?id=com.SlimeSmashStudio.SlimeSmash) and shows ads to support development. See [Ads and privacy](/help/guides/ads-and-privacy/).
- q: Which platforms can I play on?
  a: Android, and Windows PC through Google Play Games. See [Playing on PC](/help/guides/playing-on-pc/).
- q: Can I play offline?
  a: Progress you make offline is kept and synced when you are back online. Leaderboards and cloud save need a connection. See [Progress and saving](/help/guides/progress-and-saving/).
- q: How do I delete my account and data?
  a: Go to Settings, then Delete Account in the game, or email us with "Data Deletion Request" in the subject. It is permanent. See [Delete your account](/help/guides/delete-account/).
- q: Why did my progress reset?
  a: Version 1.1.1 added encryption to saves and reset progress once. Earlier versions also had save bugs, fixed in v1.0.2 and v1.0.10. If you are on the latest version and lost progress, [contact support](/help/guides/contact-support/).
- q: How do I get Chubby?
  a: Chubby is the free starter pet. Players who already had the game received it automatically on their next level after v1.1.7. See [Chubby](/help/pets/chubby/).
- q: Can I pause the game?
  a: In Casual Mode, waves can be paused mid-run. See [Casual Mode](/help/modes/casual-mode/).
- q: How do I use pet abilities on PC?
  a: Press Space during a level. See [Playing on PC](/help/guides/playing-on-pc/).
- q: Why was the Freeze Slime removed?
  a: It was retired in v1.2.0 to make room for the Chain-Reaction Slime. The Danger Bar was also removed in that update, based on player feedback. See the [changelog](/changelog.html).
- q: My leaderboard score or cloud save is not working.
  a: Check you are online and signed in to Google Play Games, update the game, and restart it. See [Troubleshooting](/help/guides/troubleshooting/).
- q: How do I turn off notifications?
  a: Use your phone's notification settings for SlimeSmash. See [Daily rewards and missions](/help/guides/daily-rewards-and-missions/).
- q: How do I report a broken level?
  a: Adventure Mode has a report system inside the game. For anything else, [contact support](/help/guides/contact-support/).
- q: Will there be multiplayer?
  a: A 1v1 multiplayer mode with trophy-based matchmaking is on the roadmap. There is no release date yet.
- q: Is SlimeSmash suitable for children?
  a: It is made for a general audience. We do not knowingly collect personal information from children under 13. See the [Privacy Policy](/privacy.html).
- q: How do I contact the developer?
  a: Email Slimesmash.support@gmail.com. See [Contact support](/help/guides/contact-support/) for what to include.
- q: How many levels are there in Adventure Mode?
  a: There are 50 levels in five zones of ten. Every 5th level is a Surf level. See [All levels](/help/levels/all-levels/).
- q: What is the best pet?
  a: It depends on the mode. [Rumble](/help/pets/rumble/) is great early, [Guard](/help/pets/guard/) is the best for survival, and [Zap](/help/pets/zap/) helps on tight late levels. See [Which pet should I get?](/help/pets/choosing-a-pet/).
- q: How do I unlock Casual Mode?
  a: Reach Adventure level 5 (clear level 4). The lock screen shows a progress bar. See [Casual Mode](/help/modes/casual-mode/).
- q: What is Waves Mode?
  a: It is an older in-game name for Casual Mode. Some unlock messages still say Waves Mode. See [Casual Mode](/help/modes/casual-mode/).
- q: How do I unlock more pets?
  a: Four pets unlock by reaching Adventure levels (Rumble at 4, Guard at 12, Lure at 16, Purify at 30). The rest are bought in the Store. See [Pets and companions](/help/pets/companions-and-pets/).
- q: How much do Store pets cost?
  a: Echo and Frost cost 800 coins, Bones 1,200, Flash and Zap 1,500, and Vortex 2,000. All together that is 6,800 coins. See [Coins and the Store](/help/guides/coins-and-store/).
- q: How do I earn coins quickly?
  a: Claim your daily reward, finish missions, and push for record waves in Casual and Defense modes. See [Earning coins fast](/help/guides/earning-coins-fast/).
- q: Can I buy coins with real money?
  a: No. Coins are earned only by playing. See [Coins and the Store](/help/guides/coins-and-store/).
- q: Is there a maximum number of coins?
  a: Yes, 99,999,999. See [Game limits and rules](/help/reference/game-limits/).
- q: How does the daily reward work?
  a: Claim once every 24 hours. The five-day cycle pays 250, 300, 400, 500 and 700 coins. Wait more than 48 hours and the streak resets. See [Daily rewards and missions](/help/guides/daily-rewards-and-missions/).
- q: How many daily missions are there?
  a: Three per day, resetting at midnight UTC. See [Daily rewards and missions](/help/guides/daily-rewards-and-missions/).
- q: What does the Poison Slime do?
  a: Tapping it takes 3 seconds off the timer. Leave it alone and nothing happens. See [Poison Slime](/help/slimes/poison-slime/).
- q: What is the Trap Slime?
  a: Tapping it costs 1 point and halves your score gains for 2 seconds. See [Trap Slime](/help/slimes/trap-slime/).
- q: What does the Mega Combo Slime do?
  a: It doubles the points you earn for 3 seconds. See [Mega Combo Slime](/help/slimes/mega-combo-slime/).
- q: How does the Chain-Reaction Slime work?
  a: Pop it to link every good slime on screen, then pop any linked slime to detonate them all. See [Chain-Reaction Slime](/help/slimes/chain-reaction-slime/).
- q: Why do Shield Slimes need two taps?
  a: The first tap breaks the shield, the second pops it for 2 points. See [Shield Slime](/help/slimes/shield-slime/).
- q: Why can't I pop the Ghost Slime?
  a: It only takes hits while it is more than half visible. Wait until it brightens. See [Ghost Slime](/help/slimes/ghost-slime/).
- q: Why did my screen flip?
  a: A Mirror Slime in Casual Mode flips the play area for 5 seconds. See [Mirror Slime](/help/slimes/mirror-slime/).
- q: What does the Heart Slime do?
  a: It restores one heart in Casual Mode. See [Heart Slime](/help/slimes/heart-slime/).
- q: Which slimes are bad?
  a: Only Poison and Trap slimes. See [Slime types](/help/slimes/slime-types/).
- q: When does each slime first appear?
  a: Poison level 2, Money 3, Extra Time 4, Explosive 5, Shield 10, Trap 18, Split 26, Mega Combo 34, Chain-Reaction 42. See [All levels](/help/levels/all-levels/).
- q: What is a Surf level?
  a: Every 5th Adventure level, where slimes slide across the screen. See [Surf Mode](/help/modes/surf-mode/).
- q: Why did I lose time on a Surf level?
  a: A good slime left the screen, which costs 3 seconds and breaks your combo. Guard blocks that. See [Surf strategy](/help/guides/surf-strategy/).
- q: Does the combo counter increase my score?
  a: No. It is a visual meter with messages at 5, 10, 20, 30 and 50. Multipliers come from Mega Combo and Trap slimes. See [Score and multipliers](/help/reference/score-and-multipliers/).
- q: How many hearts do I have in Casual Mode?
  a: Three. A good slime that expires costs a heart. See [Casual Mode](/help/modes/casual-mode/).
- q: How does Defense Mode work?
  a: You protect a base from slimes arriving from every direction. The base survives one hit. See [Defense Mode](/help/modes/defense-mode/).
- q: What is a Surge wave?
  a: Every 5th wave in Defense Mode, with 1.5 times the slimes at double spawn speed. See [Defense Mode](/help/modes/defense-mode/).
- q: What are Defense checkpoints?
  a: Every 5 waves your progress is saved, and your next run starts after it. See [Defense Mode](/help/modes/defense-mode/).
- q: Is Defense Mode in the game?
  a: Yes. 360° Base Defense arrived in 2.0 and is now the main way to play. See [Defense Mode](/help/modes/defense-mode/) and [What's new in 2.0](/help/updates/whats-new-in-2-0/).
- q: Are companions still in the game?
  a: No. Companions were removed in 2.0. Pets stay. See [What's new in 2.0](/help/updates/whats-new-in-2-0/).
- q: What happened to pet upgrades?
  a: Pet upgrades were removed in 2.0, and pets will keep improving in small patches. See [What's new in 2.0](/help/updates/whats-new-in-2-0/).
- q: Is there music?
  a: No. Music was removed in 2.0, and the game has sound effects only. See [Settings](/help/guides/settings/).
- q: What is new in SlimeSmash 2.0?
  a: A new 360° Defense Mode, five languages, new backgrounds, a rebuilt tutorial and save system, and a redesigned Surf Mode. Companions, pet upgrades, music and the Devourer were removed. See [What's new in 2.0](/help/updates/whats-new-in-2-0/).
- q: Will my progress carry over to 2.0?
  a: Yes. Existing 1.x saves and your Waves and Defense records are migrated automatically when you update. See [Progress and saving](/help/guides/progress-and-saving/).
- q: Why does the game run at 60 FPS now?
  a: 60 FPS is the new default for better battery life. You can turn on High FPS in [Settings](/help/guides/settings/).
- q: Which languages are supported?
  a: English, Spanish, French, German and Brazilian Portuguese. See [Languages](/help/guides/languages/).
- q: How do I change my name?
  a: Open the profile in the game. Names must be 3 to 12 characters and you can change it once every 60 seconds. See [Player name and profile](/help/guides/player-name-and-profile/).
- q: How do I get a different icon?
  a: Buy one in the Store's Icons tab for 100 coins. See [Player name and profile](/help/guides/player-name-and-profile/).
- q: What are the achievements?
  a: 'Ten achievements: six for clearing Adventure levels and four for popping slimes. See [Achievements](/help/reference/achievements/).'
- q: How do the leaderboards work?
  a: Your best wave is submitted when you set a new record, and offline scores are sent later. See [Leaderboards and achievements](/help/guides/leaderboards-and-achievements/).
- q: What do I do if the game asks which save to keep?
  a: Pick the save with more progress. The panel shows level, coins and slimes discovered. See [Progress and saving](/help/guides/progress-and-saving/).
- q: How do I move to a new phone?
  a: Sign in to Google Play Games on the new device and open the game. Your cloud save syncs. See [Accounts and sign-in](/help/guides/accounts-and-sign-in/).
- q: Can I play on iPhone?
  a: SlimeSmash is available on Android, and on Windows through Google Play Games. See [Playing on PC](/help/guides/playing-on-pc/).
- q: Can I play on a computer?
  a: Yes, on Windows through Google Play Games, with keyboard support. See [Playing on PC](/help/guides/playing-on-pc/).
- q: Does the game pause when I switch apps?
  a: Yes. It pauses automatically when the app goes to the background.
- q: What is High FPS?
  a: A setting that uses 120 FPS on 120 Hz screens, and 60 otherwise. See [Settings](/help/guides/settings/).
- q: Why are there ads?
  a: Ads support development. Interstitials are spaced at least 75 seconds apart. See [Ads and privacy](/help/guides/ads-and-privacy/).
- q: Can I remove ads?
  a: A one-time Remove Ads purchase may be available in your version. See [Remove Ads](/help/guides/remove-ads/).
- q: Do I have to watch ads?
  a: Rewarded ads, such as for rerolling a mission, are optional. See [Ads and privacy](/help/guides/ads-and-privacy/).
- q: What data does the game collect?
  a: See the [Privacy Policy](/privacy.html) for everything the game collects and every service it uses.
- q: How do I report a bug?
  a: Email us with your device model, Android version and game version. See [Contact support](/help/guides/contact-support/).
- q: Why does my pet button not work?
  a: Ability pets have a cooldown and a limited number of uses per Adventure level. Passive pets have no button. See [Pets and companions](/help/pets/companions-and-pets/).
- q: How long are pet cooldowns in Casual and Defense?
  a: Base cooldown plus 18 divided by max uses, for example 18 seconds for Frost. See [Pets in endless modes](/help/reference/pets-in-endless-modes/).
- q: Does Frost let me pop slimes while frozen?
  a: No. Slimes and the level clock both pause. See [Frost](/help/pets/frost/).
- q: Does Guard block everything?
  a: It blocks time loss, heart loss and base hits for 5 seconds, but not Trap's half-score effect. See [Guard](/help/pets/guard/).
- q: Why does Echo sometimes hit a bad slime?
  a: It pops the nearest slime, even a bad one. See [Echo](/help/pets/echo/).
- q: Does Bones work on Surf levels?
  a: No, because Surf slimes never expire. See [Bones](/help/pets/bones/).
- q: What does Vortex do to my score?
  a: Slimes it clears give no points and no penalties. See [Vortex](/help/pets/vortex/).
- q: Where can I see level targets and timers?
  a: Every level has its own page. Start at [All levels](/help/levels/all-levels/).
- q: Can level values change?
  a: Yes. Some values can be tuned remotely between updates, so your game may differ slightly from the wiki.
- q: What is Maximus?
  a: A former companion with the Pinball ability, removed in 2.0. See [Maximus](/help/pets/maximus/).
- q: Where is the full list of changes?
  a: See [Version history](/help/updates/version-history/) or the [changelog](/changelog.html).
