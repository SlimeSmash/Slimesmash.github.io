- q: Is SlimeSmash free?
  a: >-
    Yes. It is free to download on [Google Play](https://play.google.com/store/apps/details?id=com.SlimeSmashStudio.SlimeSmash) and shows ads to support development. See [Ads and privacy](/help/guides/ads-and-privacy/).
- q: Which platforms can I play on?
  a: >-
    Android, and Windows PC through Google Play Games. See [Playing on PC](/help/guides/playing-on-pc/).
- q: Can I play offline?
  a: >-
    Progress you make offline is kept and synced when you are back online. Leaderboards and cloud save need a connection. See [Progress and saving](/help/guides/progress-and-saving/).
- q: How do I delete my account and data?
  a: >-
    Go to Settings, then Delete Account in the game, or email us with "Data Deletion Request" in the subject. It is permanent. See [Delete your account](/help/guides/delete-account/).
- q: Why did my progress reset?
  a: >-
    Version 1.1.1 added encryption to saves and reset progress once. Earlier versions also had save bugs, fixed in v1.0.2 and v1.0.10. If you are on the latest version and lost progress, [contact support](/help/guides/contact-support/).
- q: How do I get Chubby?
  a: >-
    Chubby is the free starter pet. Players who already had the game received it automatically on their next level after v1.1.7. See [Chubby](/help/pets/chubby/).
- q: Can I pause the game?
  a: >-
    In Casual Mode, waves can be paused mid-run. See [Casual Mode](/help/modes/casual-mode/).
- q: How do I use pet abilities on PC?
  a: >-
    Press Space during a level. See [Playing on PC](/help/guides/playing-on-pc/).
- q: Why was the Freeze Slime removed?
  a: >-
    It was retired in v1.2.0 to make room for the Chain-Reaction Slime. The Danger Bar was also removed in that update, based on player feedback. See the [changelog](/changelog.html).
- q: My leaderboard score or cloud save is not working.
  a: >-
    Check you are online and signed in to Google Play Games, update the game, and restart it. See [Troubleshooting](/help/guides/troubleshooting/).
- q: How do I turn off notifications?
  a: >-
    Use your phone's notification settings for SlimeSmash. See [Daily rewards and missions](/help/guides/daily-rewards-and-missions/).
- q: How do I report a broken level?
  a: >-
    Adventure Mode has a report system inside the game. For anything else, [contact support](/help/guides/contact-support/).
- q: Will there be multiplayer?
  a: >-
    A 1v1 multiplayer mode with trophy-based matchmaking is on the roadmap. There is no release date yet.
- q: Is SlimeSmash suitable for children?
  a: >-
    It is made for a general audience. We do not knowingly collect personal information from children under 13. See the [Privacy Policy](/privacy.html).
- q: How do I contact the developer?
  a: >-
    Email Slimesmash.support@gmail.com. See [Contact support](/help/guides/contact-support/) for what to include.
